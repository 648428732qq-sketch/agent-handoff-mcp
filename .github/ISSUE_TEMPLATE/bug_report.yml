name: Bug Report（问题反馈）
description: 反馈 agent-handoff-mcp 的异常、兼容性或交接失败问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请描述问题和复现步骤。源码安装后可运行 `node dist/src/cli.js report`，或在 Agent 中调用 `handoff_diagnostics` 获取诊断报告。诊断为可选项，安装或启动失败时可直接反馈。提交前请核对报告中的路径和日志摘要。

  - type: checkboxes
    id: agents
    attributes:
      label: 涉及的 AI Agent（可多选）
      options:
        - label: Antigravity
        - label: Codex
        - label: Trae
        - label: WorkBuddy
        - label: Claude Code
        - label: Cursor / Windsurf
        - label: Web AI (CLI export)
        - label: 其他

  - type: textarea
    id: description
    attributes:
      label: 问题描述与复现步骤
      placeholder: |
        1. 我在 <Agent A> 里执行了...
        2. 切到 <Agent B> 后执行了...
        3. 预期结果 vs 实际报错...
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断报告或错误日志（可选）
      description: 可以粘贴 doctor 或 report 输出。请先核对并删去不适合公开的路径、凭据或其他敏感信息。
      render: markdown
    validations:
      required: false
